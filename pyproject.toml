[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-scout"
version = "0.1.0"
description = "Autonomous YouTube radar and timestamped architectural insight scout"
authors = [{ name = "Keith" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "youtube-transcript-api>=0.6.0",
    "yt-dlp>=2024.0.0",
    "openai>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0"
]

[project.scripts]
youtube-scout = "youtube_scout.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
